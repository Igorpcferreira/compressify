name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · format · testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: npm run check
        run: npm run check

  build:
    name: build estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar exportação estática
        run: npm run build

      # A promessa do produto é que nada é enviado. Se o build gerar qualquer
      # serverless function, a promessa deixou de ser estrutural — falha aqui.
      - name: Verificar que o deploy não contém funções
        run: |
          if [ -d ".next/server/app" ] && find .next/server/app -name "*.func" | grep -q .; then
            echo "::error::O build gerou serverless functions. O projeto deve ser 100% estático."
            exit 1
          fi
          test -f out/index.html || { echo "::error::out/index.html não foi gerado."; exit 1; }
          echo "OK: exportação estática, sem funções."

  e2e:
    name: E2E · Chrome, Firefox e WebKit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Os navegadores são pesados e mudam pouco: a chave é a versão do
      # Playwright declarada no lockfile.
      - name: Cache dos navegadores
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegadores
        run: npx playwright install --with-deps chromium firefox webkit

      # O E2E roda contra o artefato de deploy, não contra o dev server: é o
      # único jeito de o privacy.spec.ts afirmar algo sobre o que vai ao ar.
      - name: Gerar exportação estática
        run: npm run build

      - name: npm run e2e
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
